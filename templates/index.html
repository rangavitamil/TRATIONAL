<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traditional Handicraft Knowledge Assistant</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f1ea;color:#29231d}.container{max-width:950px;margin:40px auto;padding:20px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px #00000012}h1{text-align:center;margin:0 0 8px}.subtitle{text-align:center;color:#74695f;margin-bottom:25px}.upload{border:2px dashed #c8b7a5;border-radius:14px;padding:20px;text-align:center;background:#faf8f5}button{border:0;border-radius:10px;padding:11px 18px;background:#6b4f3a;color:#fff;cursor:pointer;font-weight:600}input[type=file]{margin:12px}.status{margin-top:10px;min-height:22px;color:#5c5148}.chat{margin-top:25px;border:1px solid #e4ddd5;border-radius:14px;overflow:hidden}.messages{height:390px;overflow-y:auto;padding:18px;background:#fcfbf9}.msg{max-width:80%;padding:12px 15px;margin:10px 0;border-radius:14px;line-height:1.5;white-space:pre-wrap}.user{margin-left:auto;background:#eadbcd}.bot{background:#eee9e3}.source{font-size:12px;color:#74695f;margin-top:7px}.composer{display:flex;gap:10px;padding:14px;border-top:1px solid #e4ddd5}.composer input{flex:1;padding:12px;border:1px solid #cfc5bb;border-radius:10px;font-size:15px}@media(max-width:650px){.composer{flex-direction:column}.msg{max-width:95%}}</style></head><body><div class="container"><div class="card"><h1>🧵 Traditional Handicraft Knowledge Assistant</h1><div class="subtitle">Upload a handicraft PDF and ask questions from its knowledge base.</div><div class="upload"><b>Upload Knowledge PDF</b><br><input id="pdfFile" type="file" accept=".pdf"><br><button onclick="uploadPDF()">Upload PDF</button><div id="uploadStatus" class="status"></div></div><div class="chat"><div id="messages" class="messages"><div class="msg bot">Hello! Upload a traditional handicraft PDF, then ask questions about the uploaded content.</div></div><div class="composer"><input id="question" placeholder="Ask a question about the uploaded PDF..." onkeydown="if(event.key==='Enter')sendMessage()"><button onclick="sendMessage()">Send</button></div></div></div></div><script>function addMessage(t,c,s=''){const b=document.getElementById('messages'),d=document.createElement('div');d.className='msg '+c;d.textContent=t;b.appendChild(d);if(s){const x=document.createElement('div');x.className='source';x.textContent='Source: '+s;b.appendChild(x)}b.scrollTop=b.scrollHeight}async function uploadPDF(){const f=document.getElementById('pdfFile').files[0],st=document.getElementById('uploadStatus');if(!f){st.textContent='Please select a PDF.';return}st.textContent='Uploading and processing PDF...';const form=new FormData();form.append('file',f);try{const r=await fetch('/upload',{method:'POST',body:form}),d=await r.json();st.textContent=d.message||d.error||'Upload finished.'}catch(e){st.textContent='Upload failed: '+e.message}}async function sendMessage(){const i=document.getElementById('question'),q=i.value.trim();if(!q)return;addMessage(q,'user');i.value='';addMessage('Thinking...','bot');try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})}),d=await r.json(),m=document.getElementById('messages');m.removeChild(m.lastElementChild);addMessage(d.answer||d.error||'Something went wrong.','bot',(d.sources||[]).join(', '))}catch(e){const m=document.getElementById('messages');m.removeChild(m.lastElementChild);addMessage('Error: '+e.message,'bot')}}</script></body></html>
