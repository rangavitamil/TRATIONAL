<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Traditional Handicraft Knowledge Assistant
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f5efe6,
                    #eadbc8
                );

            color: #30261f;

            min-height: 100vh;

        }


        .container {

            width: 92%;

            max-width: 1000px;

            margin:
                40px auto;

        }


        .card {

            background: white;

            border-radius: 22px;

            padding: 30px;

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.12);

        }


        .header {

            text-align: center;

            margin-bottom: 28px;

        }


        .header h1 {

            margin: 0;

            font-size: 32px;

        }


        .header p {

            color: #76695d;

            margin-top: 10px;

        }


        /* ==========================
           UPLOAD
        ========================== */

        .upload-box {

            border:
                2px dashed #b9a18a;

            border-radius: 16px;

            padding: 25px;

            text-align: center;

            background: #fcfaf7;

        }


        .upload-box h3 {

            margin-top: 0;

        }


        .file-input {

            margin:
                15px 0;

        }


        input[type="file"] {

            padding: 10px;

            max-width: 100%;

        }


        button {

            border: none;

            background: #76543d;

            color: white;

            padding:
                12px 20px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;

        }


        button:hover {

            opacity: 0.9;

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        #uploadStatus {

            margin-top: 14px;

            font-size: 14px;

            min-height: 20px;

        }


        /* ==========================
           CHAT
        ========================== */

        .chat-container {

            margin-top: 25px;

            border:
                1px solid #ddd2c6;

            border-radius: 16px;

            overflow: hidden;

        }


        .messages {

            height: 430px;

            overflow-y: auto;

            padding: 20px;

            background: #fdfbf8;

        }


        .message {

            max-width: 80%;

            padding:
                13px 16px;

            margin:
                10px 0;

            border-radius: 15px;

            line-height: 1.5;

            white-space: pre-wrap;

        }


        .bot {

            background: #eee7df;

            margin-right: auto;

        }


        .user {

            background: #dfc9b3;

            margin-left: auto;

        }


        .source {

            font-size: 12px;

            color: #7b7067;

            margin:
                -5px 0
                10px 5px;

        }


        /* ==========================
           INPUT
        ========================== */

        .chat-input {

            display: flex;

            gap: 10px;

            padding: 15px;

            border-top:
                1px solid #ddd2c6;

            background: white;

        }


        .chat-input input {

            flex: 1;

            padding: 13px;

            border:
                1px solid #cfc3b7;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

        }


        .chat-input input:focus {

            border-color: #76543d;

        }


        .loading {

            opacity: 0.65;

        }


        @media(max-width: 650px) {

            .container {

                width: 96%;

                margin: 15px auto;

            }


            .card {

                padding: 18px;

            }


            .header h1 {

                font-size: 25px;

            }


            .chat-input {

                flex-direction: column;

            }


            .message {

                max-width: 95%;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="card">


        <!-- HEADER -->

        <div class="header">

            <h1>
                🧵 Traditional Handicraft
                Knowledge Assistant
            </h1>

            <p>
                Upload a PDF and ask questions
                from its knowledge base.
            </p>

        </div>



        <!-- PDF UPLOAD -->

        <div class="upload-box">

            <h3>
                📄 Upload Handicraft PDF
            </h3>

            <p>
                Select a PDF containing
                traditional handicraft information.
            </p>


            <div class="file-input">

                <input
                    id="pdfFile"
                    type="file"
                    accept=".pdf,application/pdf"
                >

            </div>


            <button
                id="uploadButton"
                onclick="uploadPDF()"
            >
                Upload PDF
            </button>


            <div id="uploadStatus"></div>

        </div>



        <!-- CHAT -->

        <div class="chat-container">


            <div
                id="messages"
                class="messages"
            >

                <div class="message bot">

                    Hello! 👋

                    Upload a traditional
                    handicraft PDF first.

                    Then ask me questions
                    about the PDF.

                </div>

            </div>



            <!-- CHAT INPUT -->

            <div class="chat-input">

                <input
                    id="question"
                    type="text"
                    placeholder="Ask a question about the uploaded PDF..."
                    onkeydown="handleEnter(event)"
                >


                <button
                    id="sendButton"
                    onclick="sendMessage()"
                >
                    Send
                </button>

            </div>


        </div>


    </div>

</div>



<script>


// =====================================================
// ADD MESSAGE
// =====================================================

function addMessage(
    text,
    type,
    sources = []
) {

    const messages =
        document.getElementById(
            "messages"
        );


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " + type;


    message.textContent =
        text;


    messages.appendChild(
        message
    );


    // Sources

    if (
        sources &&
        sources.length > 0
    ) {

        const sourceDiv =
            document.createElement(
                "div"
            );


        sourceDiv.className =
            "source";


        sourceDiv.textContent =
            "📄 Source: " +
            sources.join(", ");


        messages.appendChild(
            sourceDiv
        );

    }


    messages.scrollTop =
        messages.scrollHeight;

}



// =====================================================
// UPLOAD PDF
// =====================================================

async function uploadPDF() {

    const fileInput =
        document.getElementById(
            "pdfFile"
        );


    const uploadButton =
        document.getElementById(
            "uploadButton"
        );


    const status =
        document.getElementById(
            "uploadStatus"
        );


    const file =
        fileInput.files[0];


    // No file

    if (!file) {

        status.textContent =
            "❌ Please select a PDF file.";

        return;

    }


    // Check PDF

    if (
        !file.name
            .toLowerCase()
            .endsWith(".pdf")
    ) {

        status.textContent =
            "❌ Only PDF files are allowed.";

        return;

    }


    uploadButton.disabled =
        true;


    status.textContent =
        "⏳ Uploading and processing PDF...";


    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    try {

        const response =
            await fetch(
                "/upload",
                {
                    method: "POST",
                    body: formData
                }
            );


        // Read as TEXT first
        // This prevents:
        // Unexpected end of JSON input

        const text =
            await response.text();


        let data = {};


        if (text.trim()) {

            try {

                data =
                    JSON.parse(text);

            }

            catch (jsonError) {

                throw new Error(
                    "Server returned invalid response: " +
                    text
                );

            }

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "PDF upload failed."
            );

        }


        if (data.success) {

            status.textContent =
                "✅ " +
                data.message;

        }

        else {

            status.textContent =
                "❌ " +
                (
                    data.error ||
                    "Upload failed."
                );

        }


    }

    catch (error) {

        console.error(
            "UPLOAD ERROR:",
            error
        );


        status.textContent =
            "❌ " +
            error.message;

    }

    finally {

        uploadButton.disabled =
            false;

    }

}



// =====================================================
// SEND CHAT MESSAGE
// =====================================================

async function sendMessage() {

    const input =
        document.getElementById(
            "question"
        );


    const sendButton =
        document.getElementById(
            "sendButton"
        );


    const question =
        input.value.trim();


    if (!question) {

        return;

    }


    // User message

    addMessage(
        question,
        "user"
    );


    input.value = "";


    sendButton.disabled =
        true;


    // Temporary message

    const messages =
        document.getElementById(
            "messages"
        );


    const loading =
        document.createElement(
            "div"
        );


    loading.className =
        "message bot loading";


    loading.id =
        "loadingMessage";


    loading.textContent =
        "⏳ Thinking...";


    messages.appendChild(
        loading
    );


    messages.scrollTop =
        messages.scrollHeight;


    try {


        const response =
            await fetch(
                "/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: question
                    })

                }
            );


        // IMPORTANT:
        // Read text before JSON

        const text =
            await response.text();


        let data = {};


        if (text.trim()) {

            try {

                data =
                    JSON.parse(text);

            }

            catch (jsonError) {

                throw new Error(
                    "Server returned invalid response: " +
                    text
                );

            }

        }


        // Remove loading

        const loadingMessage =
            document.getElementById(
                "loadingMessage"
            );


        if (loadingMessage) {

            loadingMessage.remove();

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Chat request failed."
            );

        }


        if (data.answer) {

            addMessage(

                data.answer,

                "bot",

                data.sources || []

            );

        }

        else {

            addMessage(

                "Sorry, I could not get an answer.",

                "bot"

            );

        }


    }

    catch (error) {

        console.error(
            "CHAT ERROR:",
            error
        );


        const loadingMessage =
            document.getElementById(
                "loadingMessage"
            );


        if (loadingMessage) {

            loadingMessage.remove();

        }


        addMessage(

            "❌ Error: " +
            error.message,

            "bot"

        );

    }

    finally {

        sendButton.disabled =
            false;

        input.focus();

    }

}



// =====================================================
// ENTER KEY
// =====================================================

function handleEnter(event) {

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        sendMessage();

    }

}

</script>


</body>

</html>
